spring:
  datasource:
    url: jdbc:h2:file:${H2_DB_PATH:${user.home}/.homerun/h2/homerun};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update

oci:
  enabled: ${OCI_ENABLED:false}
  config-path: ${OCI_CONFIG_PATH:C:/key/oci_config}

app:
  docs:
    enabled: ${APP_DOCS_ENABLED:true}
