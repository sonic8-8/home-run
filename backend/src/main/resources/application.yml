spring:
  application:
    name: homerun
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

ssafy:
  api:
    base-url: https://finopenapi.ssafy.io/ssafy/api/v1/edu
    api-key: ${SSAFY_API_KEY:f337ce43034b4950bb0c385ddc99c895}

fss:
  api:
    base-url: https://finlife.fss.or.kr/finlifeapi
    auth-key: ${FSS_API_KEY:debf8714241ee1f79453f666d751c22e}

jwt:
  secret: ${JWT_SECRET:01234567890123456789012345678901}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:1800}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}

# 한국투자증권 OpenAPI (실전 도메인 - 시세 조회 전용)
# appkey/appsecret은 https://apiportal.koreainvestment.com 에서 발급
# 예시: app-key: PSxxxxxxxx  /  app-secret: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
kis:
  api:
    base-url: ${KIS_API_BASE_URL:https://openapi.koreainvestment.com:9443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
