spring:
  application:
    name: homerun
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

ssafy:
  api:
    base-url: https://finopenapi.ssafy.io/ssafy/api/v1/edu
    api-key: ${SSAFY_API_KEY:f337ce43034b4950bb0c385ddc99c895}

fss:
  api:
    base-url: https://finlife.fss.or.kr/finlifeapi
    auth-key: ${FSS_API_KEY:debf8714241ee1f79453f666d751c22e}

jwt:
  secret: ${JWT_SECRET:01234567890123456789012345678901}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:1800}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}

# 한국투자증권 OpenAPI (실전 도메인 - 시세 조회 전용)
# appkey/appsecret은 https://apiportal.koreainvestment.com 에서 발급
# 예시: app-key: PSxxxxxxxx  /  app-secret: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
kis:
  api:
    base-url: ${KIS_API_BASE_URL:https://openapi.koreainvestment.com:9443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}

oci:
  enabled: ${OCI_ENABLED:false}
  profile: ${OCI_PROFILE:DEFAULT}
  region: ${OCI_REGION:ap-singapore-1}
  namespace: ${OCI_NAMESPACE:axyqj6o2a3yw}
  bucket-name: ${OCI_BUCKET_NAME:bucket-20260316-1523}

public-data:
  api:
    legal-dong-base-url: ${PUBLIC_DATA_LEGAL_DONG_BASE_URL:https://apis.data.go.kr/1741000/StanReginCd}
    apartment-trade-base-url: ${PUBLIC_DATA_APARTMENT_TRADE_BASE_URL:https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade}
    service-key: ${PUBLIC_DATA_SERVICE_KEY:}
    page-size: ${PUBLIC_DATA_PAGE_SIZE:1000}

naver:
  geocoding:
    base-url: ${NAVER_GEOCODING_BASE_URL:https://maps.apigw.ntruss.com/map-geocode/v2/geocode}
    client-id: ${NAVER_GEOCODING_CLIENT_ID:}
    client-secret: ${NAVER_GEOCODING_CLIENT_SECRET:}

app:
  real-estate-import:
    enabled: ${REAL_ESTATE_IMPORT_ENABLED:false}
    regions: ${REAL_ESTATE_IMPORT_REGIONS:SEOUL}
    from-year-month: ${REAL_ESTATE_IMPORT_FROM_YEAR_MONTH:2025-12}
    to-year-month: ${REAL_ESTATE_IMPORT_TO_YEAR_MONTH:2025-12}
    dataset-types: ${REAL_ESTATE_IMPORT_DATASET_TYPES:APT_SALE}
