spring:
  datasource:
    url: jdbc:h2:mem:homerun-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  sql:
    init:
      mode: never

jwt:
  secret: 01234567890123456789012345678901
  access-token-ttl-seconds: 1800
  refresh-token-ttl-seconds: 1209600

public-data:
  api:
    legal-dong-base-url: https://apis.data.go.kr/1741000/StanReginCd
    apartment-trade-base-url: https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade
    service-key: test-service-key
    page-size: 1000

naver:
  geocoding:
    base-url: https://maps.apigw.ntruss.com/map-geocode/v2/geocode
    client-id: test-client-id
    client-secret: test-client-secret

app:
  real-estate-import:
    enabled: false
    regions:
      - SEOUL
    from-year-month: 2024-01
    to-year-month: 2024-12
    dataset-types:
      - APT_SALE
