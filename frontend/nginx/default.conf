server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /docs {
        return 302 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/ /docs/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
