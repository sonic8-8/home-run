name: homerun-runtime

services:
  backend:
    image: ${BACKEND_IMAGE:-homerun-backend:develop}
    container_name: homerun-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      OCI_ENABLED: ${OCI_ENABLED:-true}
      OCI_REGION: ${OCI_REGION:-ap-singapore-1}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-axyqj6o2a3yw}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-bucket-20260316-1523}
      PUBLIC_DATA_SERVICE_KEY: ${PUBLIC_DATA_SERVICE_KEY:-}
      NAVER_GEOCODING_CLIENT_ID: ${NAVER_GEOCODING_CLIENT_ID:-}
      NAVER_GEOCODING_CLIENT_SECRET: ${NAVER_GEOCODING_CLIENT_SECRET:-}
      REAL_ESTATE_IMPORT_ENABLED: ${REAL_ESTATE_IMPORT_ENABLED:-false}
      REAL_ESTATE_IMPORT_REGIONS: ${REAL_ESTATE_IMPORT_REGIONS:-SEOUL}
      REAL_ESTATE_IMPORT_FROM_YEAR_MONTH: ${REAL_ESTATE_IMPORT_FROM_YEAR_MONTH:-2025-12}
      REAL_ESTATE_IMPORT_TO_YEAR_MONTH: ${REAL_ESTATE_IMPORT_TO_YEAR_MONTH:-2025-12}
      REAL_ESTATE_IMPORT_DATASET_TYPES: ${REAL_ESTATE_IMPORT_DATASET_TYPES:-APT_SALE}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8081}:8080"
    networks:
      - backend_net

  postgres:
    image: postgres:16-alpine
    container_name: homerun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - homerun_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net

  redis:
    image: redis:7.2-alpine
    container_name: homerun-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - homerun_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend_net

volumes:
  homerun_postgres_data:
  homerun_redis_data:

networks:
  backend_net:
    internal: true
