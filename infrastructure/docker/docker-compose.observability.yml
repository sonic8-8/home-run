name: homerun-runtime

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-homerun-prometheus:develop}
    container_name: homerun-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - homerun_prometheus_data:/prometheus
    networks:
      - web_net

  grafana:
    image: ${GRAFANA_IMAGE:-homerun-grafana:develop}
    container_name: homerun-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - homerun_grafana_data:/var/lib/grafana
    networks:
      - web_net

volumes:
  homerun_prometheus_data:
  homerun_grafana_data:

networks:
  web_net:
